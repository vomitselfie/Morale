[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morale-embroidery"
version = "0.2.0"
description = "An open-source native embroidery studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Morale contributors"}]
keywords = ["embroidery", "digitizing", "machine embroidery", "PES", "DST", "EXP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = ["PySide6>=6.8,<7", "pyembroidery>=1.5.1,<2", "svgelements>=1.9.6,<2", "vtracer==1.0.0a4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pyinstaller>=6", "build>=1"]

[project.gui-scripts]
morale = "morale.app:main"

[project.urls]
Homepage = "https://github.com/vomitselfie/Morale"
Issues = "https://github.com/vomitselfie/Morale/issues"
Changelog = "https://github.com/vomitselfie/Morale/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["morale*"]

[tool.setuptools.package-data]
morale = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
