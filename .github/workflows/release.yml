name: Release
on:
  push:
    tags: ['v*']

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Morale --collect-data morale --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." run_morale.py
      - run: python scripts/check_bundle.py --output artifacts/bundle-self-test
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "Morale-${GITHUB_REF_NAME#v}-${{ matrix.name }}.tar.gz" Morale
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Morale -DestinationPath "Morale-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.name }}.zip"
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Morale.app "Morale-${GITHUB_REF_NAME#v}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: Morale-*
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ matrix.name }}
          path: artifacts/bundle-self-test/

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          (cd bundles && sha256sum Morale-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          name: Morale ${{ github.ref_name }}
          body_path: notes.md
          files: bundles/*
