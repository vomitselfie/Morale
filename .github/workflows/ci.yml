name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: '1'
      MORALE_TEST_PROGRESS: ${{ github.workspace }}/test-progress.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        uses: ./.github/actions/qt-linux-deps
      - run: python -m pip install -e ".[dev]"
      - name: Run tests
        timeout-minutes: 35
        run: python -m pytest -q --timeout=300 --junitxml=test-results.xml
      - name: Report test results
        if: always()
        run: python scripts/ci_report.py --junit test-results.xml --progress test-progress.txt --label "${{ runner.os }} Python ${{ matrix.python }}"
