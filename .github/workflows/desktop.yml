name: Desktop checks and development bundles
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - if: github.event_name == 'workflow_dispatch'
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Morale --collect-data morale --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." run_morale.py
      - if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_bundle.py --output artifacts/bundle-self-test
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Morale-${{ matrix.os }}-development
          path: |
            dist/
            artifacts/bundle-self-test/
