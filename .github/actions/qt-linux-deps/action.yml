name: Qt system libraries (Linux)
description: Libraries PySide6 loads even with the offscreen platform, plus test tools.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
          libdbus-1-3 libxcb-cursor0 fonts-dejavu-core poppler-utils
